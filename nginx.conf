server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index _shell.html index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Health check endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Static assets with caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|mp4|webm|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing: fall back to _shell.html for deep links
    location / {
        try_files $uri $uri/ /Meridian/_shell.html /_shell.html =404;
    }
}
