# Meridian main site worker (`meridian`): Workers Rate Limiting bindings
# for POST /api/contact (review follow-up on #207, 2026-10-21).
#
# CONFIG RECORD, NOT READ BY ANY BUILD. The `meridian` worker deploys through
# Cloudflare Workers Builds, and its wrangler config lives with that project,
# not in this repo. This file is deliberately NOT at the repo root: a root
# wrangler config would change what `wrangler deploy` uploads. Copy the two
# [[ratelimits]] blocks below into the `meridian` worker's wrangler config
# (needs Wrangler 4.36.0 or later). Rate limiting bindings cannot be added
# in the dashboard yet.
#
# Cost: none. The Rate Limiting API has no plan gate and no billing line
# (docs: workers/runtime-apis/bindings/rate-limit and
# workers/platform/pricing, checked 2026-10-21; GA 2025-09-19). It only
# uses the worker's normal request CPU, so it works on the Workers Free plan.
#
# Without these bindings, the handler keeps its in-memory limiter only
# (3 per 10 min per sender, 60 per hour per isolate). That fails safe.
# With them, the limits below also apply across isolates in each
# Cloudflare location. Counts are approximate and per location.
#
# The binding names must match CLIENT_LIMITER_BINDING /
# GLOBAL_LIMITER_BINDING in src/lib/contact/rate-limiter.server.ts.
# src/lib/contact/rate-limiter.server.test.ts checks this file.
# namespace_id is any integer unique in the Cloudflare account. The
# crash-report worker uses none.

name = "meridian"

# nodejs_compat is no longer needed for contact config: the handler reads the
# worker's own env first (src/lib/contact/runtime-env.server.ts) and uses
# process.env only as a fallback. Whether the fallback can be dropped depends
# on probe A1 (docs/contact-activation.md, step 1).
#
# Contact secret (set in the dashboard as a SECRET, never in this file):
#   CONTACT_DISCORD_WEBHOOK_URL  - a webhook for a NEW private channel; never
#                                  the crash-report worker's DISCORD_WEBHOOK_URL.
#
# Probe A1 result (which server entry serves production) - NOT RUN YET, it
# runs only after #207 has deployed from main. Paste the probe's report here:
#   node --experimental-strip-types scripts/entry-fingerprint-probe.mjs \
#     --url https://meridian.knowledgetest.workers.dev
#   (pending)

# Per sender (hashed key that changes every UTC day): 3 messages per 60 s.
[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "72071"

  [ratelimits.simple]
  limit = 3
  period = 60

# Everyone together: 10 messages per 60 s per location. This caps a
# distributed flood well under Discord's webhook rate limit.
[[ratelimits]]
name = "CONTACT_GLOBAL_RATE_LIMITER"
namespace_id = "72072"

  [ratelimits.simple]
  limit = 10
  period = 60
