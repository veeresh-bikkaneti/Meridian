# Meridian crash-report worker (Cloudflare Workers).
#
# NO secrets in this file — secrets are set via `wrangler secret put`
# (see README.md). There are no [vars]: everything configurable that is
# not a secret lives in code defaults.
#
# Phase 1 telemetry: event counters live in a KV namespace bound as
# TELEMETRY_COUNTS. Created 2026-10-21 (title "TELEMETRY_COUNTS"); the
# binding below is live. If the namespace is ever recreated, update the
# id — a missing/unbound namespace only disables counting (fail-open).
name = "meridian-crash-report"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["15 * * * *"]  # hourly digest, posted ~:15 for the previous UTC hour

[[kv_namespaces]]
binding = "TELEMETRY_COUNTS"
id = "34884ed9aa46437f871278a517882e72"
