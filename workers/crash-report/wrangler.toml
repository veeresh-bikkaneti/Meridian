# Meridian crash-report worker (Cloudflare Workers).
#
# NO secrets in this file — secrets are set through the Cloudflare
# API (`cf.py secret <NAME>`; see README.md, Deploy/Secrets). This
# worker ships by direct API script upload, never `wrangler deploy`.
# There are no [vars]: everything configurable that is not a secret
# lives in code defaults.
#
# This file is the human config record of the intended setup —
# `cf.py deploy` never reads it. Bindings and triggers take effect
# as version metadata on an upload, not from this file.
#
# Phase 1 telemetry: event counters live in a KV namespace bound as
# TELEMETRY_COUNTS. The namespace was created 2026-10-21 via the
# Cloudflare API (title "TELEMETRY_COUNTS"); the block below records
# its id. A version counts only when its upload metadata carries
# this binding — a missing/unbound namespace only disables counting
# (fail-open). The digest cron below was likewise set via the API
# schedules endpoint (2026-10-21); this block is its record.
name = "meridian-crash-report"
# Local dev only: main points at the dev-entry wrapper, not index.ts —
# workerd rejects index.ts's test-only named exports (constants) as
# handler candidates (#234). Production uploads index.ts directly
# through the API and never reads this file.
main = "src/dev-entry.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["15 * * * *"]  # hourly digest, posted ~:15 for the previous UTC hour

[[kv_namespaces]]
binding = "TELEMETRY_COUNTS"
id = "34884ed9aa46437f871278a517882e72"

# Review S4 (2026-10-21): optional per-client rate limit shared across
# isolates. It uses the Workers Rate Limiting API, which is free: no plan
# gate and no billing line in Cloudflare's docs, GA 2025-09-19. Like the KV
# binding above, it takes effect only when it is in a version's upload
# metadata (see README, "What an upload does NOT carry"). Without it, the
# worker's in-memory per-isolate limiter (10 / 60 s per client) still
# applies, and a throwing binding fails open to that limiter.
# namespace_id is any positive integer unique in the account ("72071"/
# "72072" are taken by the meridian contact-form limiters). period must be
# 10 or 60.
[[ratelimits]]
name = "CRASH_RATE_LIMITER"
namespace_id = "72073"
simple = { limit = 10, period = 60 }
