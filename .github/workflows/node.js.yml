# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    timeout-minutes: 20

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        # Vite 8 needs Node 22. Node 18 cannot import `styleText` from `node:util`.
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # App typecheck (tsc --noEmit over src/ and server/). It takes about 10 s and
    # needs no secrets. Before this step only the crash worker was type-checked.
    - run: npm run typecheck
    - run: npm run build --if-present
    - run: npm test
    - run: npm run test:worker
    - run: npm run typecheck:worker
