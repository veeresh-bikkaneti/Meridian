# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    timeout-minutes: 20

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        # Vite 8 needs Node 22. Node 18 cannot import `styleText` from `node:util`.
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
      with:
        # check:provenance reads the PR's own commits, so it needs history.
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # Owner rule (2026-11-13): every PR commit is authored as the owner and
    # no commit message or added line names an AI tool. Runs on PRs only:
    # it checks the PR's own range, base..head.
    - name: Commit author and AI-name check
      if: github.event_name == 'pull_request'
      env:
        PROVENANCE_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      run: npm run check:provenance
    # App typecheck (tsc --noEmit over src/ and server/). It takes about 10 s and
    # needs no secrets. Before this step only the crash worker was type-checked.
    - run: npm run typecheck
    - run: npm run build --if-present
    - run: npm test
    - run: npm run lint:content
    # Subject leads and journal clip text (owner rules, 2026-11-13): no
    # measurements in place stories or caption leads; see
    # scripts/lint-subject-leads.mjs for every rule it applies.
    - run: npm run lint:subjects
    # One home label (nav-home council, 2026-11-13): fails on hand-written
    # home labels ("Editions", "Back to Home", …); see eslint/home-label-rule.mjs.
    - run: npm run lint:nav
    - run: npm run test:worker
    - run: npm run typecheck:worker

  # Review follow-up (2026-10-21): a small, stable Playwright smoke set runs
  # in CI against the built GitHub Pages artifact (dist/client). It covers
  # the kids'-privacy surfaces (footer note, /privacy, the grown-up gate in
  # front of /contact, Begin exploring), clean hydration, and the
  # crash-beacon transport with its pinned ingest host.
  #
  # Only specs that pass reliably on headless Chromium belong here. Specs
  # that need WebGL map clicks are left out (they are flaky without a GPU),
  # and so are the Ko-fi specs (they need VITE_KOFI_URL at build time). Run
  # the full suite locally (see README).
  #
  # Exception (fix round 2, PR #287): round-loop-a11y belongs here even
  # though it uses map clicks — its 3D test guards a product a11y
  # behavior (Zoom in during the return beat) that failed 3/3 before the
  # fix, and the full file passed 8/8 locally on headless Chromium
  # before this listing. If it flakes in CI, that is a real signal
  # about the beat, not a reason to silently drop the spec.
  #
  # endgame-share belongs here: its map tap is a DOM-level canvas click
  # plus phase transitions (no WebGL-dependent assertion), it passed 2/2
  # twice on headless Chromium, and its console gate needs real egress,
  # which CI runners have.
  #
  # playwright.config.ts uses Playwright's bundled Chromium when the dev
  # VM's /opt/meta-chromium/chrome is absent, which is the case here.
  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run build:pages
    # Entry JS budget (owner, 2026-11-10): the Phase 0 starting measurement,
    # 323,865 B gzip. Subjects load lazily, so first load should not grow.
    - run: npm run check:entry-size
    - run: >-
        npx playwright test
        tests/e2e/credits.desktop.spec.ts
        tests/e2e/grownups-privacy-contact.desktop.spec.ts
        tests/e2e/hydration-boot.desktop.spec.ts
        tests/e2e/observability.spec.ts
        tests/e2e/endgame-share.spec.ts
        tests/e2e/round-loop-a11y.spec.ts
        --workers=1 --reporter=line
    - name: Upload the Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
