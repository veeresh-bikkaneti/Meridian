# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    timeout-minutes: 20

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        # Vite 8 needs Node 22. Node 18 cannot import `styleText` from `node:util`.
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # App typecheck (tsc --noEmit over src/ and server/). It takes about 10 s and
    # needs no secrets. Before this step only the crash worker was type-checked.
    - run: npm run typecheck
    - run: npm run build --if-present
    - run: npm test
    - run: npm run lint:content
    - run: npm run test:worker
    - run: npm run typecheck:worker

  # Review follow-up (2026-10-21): a small, stable Playwright smoke set runs
  # in CI against the built GitHub Pages artifact (dist/client). It covers
  # the kids'-privacy surfaces (footer note, /privacy, the grown-up gate in
  # front of /contact, Begin exploring), clean hydration, and the
  # crash-beacon transport with its pinned ingest host.
  #
  # Only specs that pass reliably on headless Chromium belong here. Specs
  # that need WebGL map clicks are left out (they are flaky without a GPU),
  # and so are the Ko-fi specs (they need VITE_KOFI_URL at build time). Run
  # the full suite locally (see README).
  #
  # playwright.config.ts uses Playwright's bundled Chromium when the dev
  # VM's /opt/meta-chromium/chrome is absent, which is the case here.
  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run build:pages
    # Convention: an e2e test whose title contains @local-only is skipped here
    # (--grep-invert below). tests/e2e/scout-harness-suppression.desktop.spec.ts
    # holds a pair: test 1 mounts the 3D map, which this runner cannot render
    # reliably, so it is tagged @local-only and runs only on a developer machine;
    # test 2 (the weak-device degradation check) runs here. THE RUNNER MUST STAY
    # WEAK: do not "fix" the VM to make test 1 pass, because test 2 relies on
    # the real SwiftShader device being read as weak.
    - run: >-
        npx playwright test
        tests/e2e/credits.desktop.spec.ts
        tests/e2e/grownups-privacy-contact.desktop.spec.ts
        tests/e2e/hydration-boot.desktop.spec.ts
        tests/e2e/observability.spec.ts
        tests/e2e/scout-harness-suppression.desktop.spec.ts
        --grep-invert @local-only
        --workers=1 --reporter=line
    - name: Upload the Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
