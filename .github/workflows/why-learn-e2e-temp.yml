# TEMPORARY (PR #433 only): runs the Why Do We Learn This? card's 4 target
# card spec (camera-move films, phone tag fix) and prints screenshots. Removed in
# the PR's final commit before it is marked ready. Do not merge this file.
name: why-learn e2e (temporary)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/why-learn-e2e-temp.yml"
      - "tests/e2e/why-learn-card.desktop.spec.ts"

jobs:
  why-learn-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      # mobile-home-overlap.spec.ts needs it at build time (see that spec).
      VITE_KOFI_URL: https://ko-fi.com/thesaltandpepperguy
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run build:pages
    - name: Card flag check, layout and screenshots
      run: npx playwright test tests/e2e/why-learn-card.desktop.spec.ts --workers=1 --reporter=line
    - name: Print screenshots into the log (artifact downloads are blocked for the reviewing agent)
      if: always()
      run: |
        for f in why-learn-shots/*.png; do
          echo "==SHOT-BEGIN $(basename "$f")"
          base64 -w 0 "$f"; echo
          echo "==SHOT-END"
        done
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: why-learn-shots
        path: why-learn-shots/
        retention-days: 7
