# Narrow proof run for tests/e2e/detective-endings.spec.ts only.
# pull_request (no path filter) is how this branch gets repeated runs:
# workflow_dispatch is rejected until the file is on main. Empty commits
# on the pull request retrigger this job and nothing else in the
# detective suite.
name: Detective endings spec

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  endings:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run build:pages
    - run: npx playwright test tests/e2e/detective-endings.spec.ts --project=detective-endings --workers=1 --reporter=line
