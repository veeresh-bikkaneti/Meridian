services:
  meridian-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridian-ui
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
